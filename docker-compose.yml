# =============================================================================
# Stack de observabilidade LOCAL — Prometheus + Grafana.
#
# Roda apenas em desenvolvimento / Demo Day. NÃO faz parte do deploy no Render.
# A FastAPI continua rodando separadamente (uvicorn local OU Render cloud);
# o Prometheus aqui faz scrape de host.docker.internal:7860 (uvicorn local)
# ou da URL do Render (descomente em infra/prometheus.yml).
#
# Uso:
#     docker compose up -d              # sobe Prometheus + Grafana
#     # Acessar:
#     #   - Grafana:    http://localhost:3000   (admin / admin, anonymous on)
#     #   - Prometheus: http://localhost:9090
#     docker compose down               # derruba
#     docker compose down -v            # derruba + apaga volumes
#
# Pré-requisito: FastAPI rodando em outra janela:
#     uvicorn src.serving.app:app --host 0.0.0.0 --port 7860 --reload
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: copiloto-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    extra_hosts:
      # Permite scrape de uvicorn rodando no host (Mac/Win cobertos por padrão;
      # Linux precisa dessa linha para resolver host.docker.internal).
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: copiloto-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
