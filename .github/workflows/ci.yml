name: CI — Datathon Fase 05

# Pipeline: lint → type-check → security → tests → build → deploy
# Roda em PRs e push em main/develop. Caching de pip via setup-python.

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'evaluation/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.coveragerc'
      - '.github/workflows/ci.yml'
      - 'data/processed/ibov/model_lstm.keras'
      - 'data/processed/ibov/scaler.joblib'
      - 'data/processed/agent_db/'
      - 'data/processed/ibov/drift_report.json'
      - 'Dockerfile'
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint + Type + Security + Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/ evaluation/
        continue-on-error: false

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports --no-strict-optional || true
        continue-on-error: true

      - name: Security scan (bandit)
        run: bandit -r src/ -ll -ii --exclude Dockerfile

      - name: Run tests with coverage gate
        run: pytest -m "not integration"

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build Docker Image (Validation)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Test Docker Build
        # Constrói a imagem para garantir que o Dockerfile compila sem erros
        run: docker build -f Dockerfile -t copiloto-ibov:latest .

  deploy_staging:
    name: Deploy to Render
    needs: build
    
    # Executa apenas quando houver push na branch 'main'
    if: github.ref == 'refs/heads/main' 
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Erro: RENDER_DEPLOY_HOOK_URL não está configurado nos Secrets do GitHub."
            exit 1
          fi
          echo "Disparando deploy no Render..."
          curl -f -X POST "$DEPLOY_HOOK"