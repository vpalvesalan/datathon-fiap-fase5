# =============================================================================
# agent_config.yaml — Configuração centralizada do Domínio 2 (Agente LLM + RAG)
# Vive separado do model_config.yaml para não acoplar os dois domínios.
# =============================================================================

# --- LLM (Groq) ---
llm:
  provider: "groq"
  model_name: "openai/gpt-oss-120b" #"qwen/qwen3-32b", "openai/gpt-oss-20b", "openai/gpt-oss-120b", "llama-3.1-8b-instant", "llama-3.3-70b-versatile"
  temperature: 0.0
  max_tokens: 1024
  max_iterations: 5            # Limite de passos do ReAct loop

  # Rate limit (Groq free tier: 12k tokens/min). Usado pelos scripts de
  # evaluation para pausar entre iterações e não estourar a janela.
  # Para upgrade pago, aumente tokens_per_minute (ex: 60000 no tier dev).
  rate_limit:
    tokens_per_minute: 6000          # Limite do provedor (Groq free)
    estimated_tokens_per_call: 4000   # Estimativa por iteração (agente + RAGAS)
    safety_margin: 1.5                # Multiplicador conservador (50% de folga)

# --- Observabilidade (tracing do agente) ---
# MLflow Tracing é o backend primário (auto-instrumenta LangChain via
# mlflow.langchain.autolog). Langfuse é opcional: se LANGFUSE_PUBLIC_KEY
# estiver presente no .env, callbacks são adicionados em paralelo.
observability:
  mlflow_experiment_name: "agent-tracing"   # experimento separado do LSTM
  enable_mlflow_tracing: true               # false = desliga (raro)

# --- Embeddings (HuggingFace local — modelo multilingual ideal para PT-BR) ---
embeddings:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  chunk_size: 1000
  chunk_overlap: 200

# --- Vector Store (ChromaDB persistente) ---
vector_store:
  persist_directory: "data/processed/agent_db"
  collection_name: "ibov_macro_docs"

# --- Pipeline RAG ---
rag:
  retrieval_k: 4                # Top-K chunks retornados ao agente

# --- Guardrails ---
guardrails:
  max_input_length: 4096
  language: "pt"
  pii_entities:                 # Entidades Presidio a remover do output
    - "PERSON"
    - "EMAIL_ADDRESS"
    - "PHONE_NUMBER"
    - "BR_CPF"

# --- Golden Set (avaliação RAGAS) ---
golden_set:
  path: "data/golden_set/perguntas.json"

# --- Documentos brutos (PDFs) ---
agent_docs:
  raw_path: "data/raw/agent_docs"

# --- Avaliação ---
evaluation:
  ragas_output: "evaluation/results/ragas_metrics.json"
  judge_output: "evaluation/results/llm_judge.json"
  ab_test_output: "evaluation/results/ab_test_prompts.json"
  benchmark_output: "evaluation/results/benchmark_llm.json"
