[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Adiciona a raiz do projeto ao sys.path para permitir `from src.ibov_pipeline import ...`
# (mesmo padrão usado pelos scripts via `python -m src.ibov_pipeline.X`).
pythonpath = .

# Quality gate: falha se cobertura cair abaixo de 60% (GAP 04 do guia).
# Configuração de cobertura (incluindo omit) está em .coveragerc.
addopts =
    --tb=short
    --strict-markers
    --cov=src/ibov_pipeline
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=60

markers =
    slow: marca testes lentos (rodar com `pytest -m "not slow"` para pular)
    integration: marca testes que precisam de MLflow / yfinance vivos

# Silencia warnings ruidosos de TF/Keras durante coleta
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning:tensorflow.*
    ignore::FutureWarning:keras.*
